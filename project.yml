name: MyDock
options:
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  MyDock:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/MyDock
      - path: Resources/AppIcon.icns
        buildPhase: resources
    # Xcode/MyDock-Info.plist is generated from these properties and is also the template
    # BuildMyDock.sh fills in for the SwiftPM app, so add keys here and regenerate it.
    info:
      path: Xcode/MyDock-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.mydock.items
            UTTypeDescription: MyDock items
            UTTypeConformsTo:
              - public.json
        NSCalendarsFullAccessUsageDescription: MyDock reads selected calendar events for the Calendar widget.
        NSCalendarsUsageDescription: MyDock reads selected calendar events for the Calendar widget.
        NSRemindersFullAccessUsageDescription: MyDock reads, adds, and completes reminders when you use the Reminders widget.
        NSRemindersUsageDescription: MyDock reads and updates reminders when you use the Reminders widget.
        NSLocationWhenInUseUsageDescription: MyDock uses your location only when you choose current-location weather.
        NSAppleEventsUsageDescription: MyDock reads and controls Music or Spotify while you use the Now Playing widget, or asks Finder to empty Trash after you confirm.
        NSDesktopFolderUsageDescription: MyDock reads folders here only when you open one from the Dock or scan storage. Nothing is uploaded or deleted.
        NSDocumentsFolderUsageDescription: MyDock reads folders here only when you open one from the Dock or scan storage. Nothing is uploaded or deleted.
        NSDownloadsFolderUsageDescription: MyDock reads folders here only when you open one from the Dock or scan storage. Nothing is uploaded or deleted.
    entitlements:
      path: Xcode/MyDock.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        # Hardened-runtime resource access for the Calendar/Reminders and current-location Weather widgets.
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: ${MYDOCK_PRODUCT_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${MYDOCK_BUNDLE_IDENTIFIER}
        MARKETING_VERSION: ${MYDOCK_MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: ${MYDOCK_BUILD_NUMBER}
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  MyDockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/MyDockTests
    dependencies:
      - target: MyDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${MYDOCK_BUNDLE_IDENTIFIER}.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MyDock.app/Contents/MacOS/MyDock
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  MyDockUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/MyDockUITests
    dependencies:
      - target: MyDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${MYDOCK_BUNDLE_IDENTIFIER}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyDock
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  MyDock:
    build:
      targets:
        MyDock: all
    test:
      targets:
        - MyDockTests
      environmentVariables:
        MYDOCK_UNIT_TEST_HOST: "1"
  MyDock Visual QA:
    build:
      targets:
        MyDock: all
    test:
      targets:
        - MyDockUITests
