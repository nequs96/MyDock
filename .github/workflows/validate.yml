name: Validate MyDock
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK
        run: |
          SDK_MAJOR=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26 || { echo "This source requires macOS SDK 26+ for Liquid Glass APIs."; exit 1; }
      - name: Unit and regression tests
        run: ./TestMyDock.sh
      - name: Universal release build
        run: ./BuildMyDock.sh
      - name: Verify architecture and bundle
        run: |
          lipo build/MyDock.app/Contents/MacOS/MyDock -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/MyDock.app
          plutil -lint build/MyDock.app/Contents/Info.plist
      - name: Xcode app and Focus metadata
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          ./GenerateXcodeProject.sh
          xcodebuild -project MyDock.xcodeproj -scheme MyDock -configuration Release -derivedDataPath .build/ci-xcode CODE_SIGNING_ALLOWED=NO build
          test -d .build/ci-xcode/Build/Products/Release/MyDock.app/Contents/Resources/Metadata.appintents
      - uses: actions/upload-artifact@v4
        with:
          name: MyDock-local-validation-${{ matrix.os }}
          path: build/MyDock.app
          retention-days: 7
