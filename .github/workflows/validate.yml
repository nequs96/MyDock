name: Validate MyDock
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify SDK
        run: |
          SDK_MAJOR=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26 || { echo "This source requires macOS SDK 26+ for Liquid Glass APIs."; exit 1; }
          sw_vers
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Unit and regression tests
        shell: bash
        run: |
          mkdir -p .build
          # A watchdog: if the tests have not finished after 25 minutes, record every thread's stack, then stop them.
          ./TestMyDock.sh > .build/test.log 2>&1 &
          TESTS=$!
          tail -f .build/test.log --pid=$TESTS 2>/dev/null || tail -f .build/test.log &
          TAIL=$!
          for _ in $(seq 1 1500); do kill -0 $TESTS 2>/dev/null || break; sleep 1; done
          if kill -0 $TESTS 2>/dev/null; then
            echo "::error::Tests still running after 25 minutes; sampling the test processes."
            for pid in $(pgrep -f 'swiftpm-testing-helper|MyDockPackageTests'); do
              sample "$pid" 3 -file ".build/hang-$pid.txt" >/dev/null 2>&1 || true
              echo "===== stacks of $pid"; grep -E 'Thread_|^ +[+!:| ]*[0-9]+ ' ".build/hang-$pid.txt" | grep -E 'Thread_|MyDock|Test' | head -150
            done
            pkill -f 'swiftpm-testing-helper|MyDockPackageTests' || true
            kill $TESTS 2>/dev/null || true
            kill $TAIL 2>/dev/null || true
            exit 1
          fi
          kill $TAIL 2>/dev/null || true
          wait $TESTS
      - name: Report compiler errors and crashes
        if: failure()
        shell: bash
        run: |
          # Compiler errors and the context of a compiler crash, printed last and annotated, so a long log cannot hide them.
          ERRORS=$(grep -E '\.swift:[0-9]+:[0-9]+: error: ' .build/test.log 2>/dev/null | sort -u || true)
          # Errors inside macro expansions (#expect, #require) name their source on the next line.
          MACRO=$(awk '/^macro expansion .*: error: /{e=$0; if ((getline n) > 0) {sub(/^[` -]+/, "", n); sub(/: note: expanded code originates here/, "", n); print n ": " e}}' .build/test.log 2>/dev/null | sort -u || true)
          CRASH=$(grep -E -A1 'While running pass|While evaluating request|Stack dump|Please submit a bug report' .build/test.log 2>/dev/null || true)
          # Errors without a source location (a killed or crashed compiler job, a link failure) and signal reports.
          OTHER=$(grep -E '^(error|fatal error|ld|clang): |signal [0-9]+|Killed|Fatal error|Assertion failed|Program arguments' .build/test.log 2>/dev/null | grep -v -E ': warning: ' | sort -u | head -20 || true)
          printf '%s\n' "$ERRORS" "$MACRO" "$CRASH" "$OTHER"
          # What was compiling just before the first unlocated error.
          grep -n -E -B12 -m1 '^(error|fatal error): ' .build/test.log 2>/dev/null || true
          printf '%s\n' "$ERRORS" "$MACRO" "$CRASH" "$OTHER" | grep . | head -10 | sed 's/%/%25/g; s/^/::error::/' || true
      - name: Report test totals and compiler warnings
        if: always()
        shell: bash
        run: |
          # The Swift Testing totals and each distinct compiler warning from the test build become annotations on the run.
          TOTALS=$(grep -E 'Test run with [0-9]+ tests? ' .build/test.log 2>/dev/null | tail -1 | sed -E 's/^[^A-Za-z]*//' || true)
          if [ -n "$TOTALS" ]; then echo "$TOTALS" >> "$GITHUB_STEP_SUMMARY"; echo "::notice::$TOTALS"; fi
          WARNINGS=$(grep -E '\.swift:[0-9]+:[0-9]+: warning: ' .build/test.log 2>/dev/null | sort -u || true)
          COUNT=$(printf '%s\n' "$WARNINGS" | grep -c . || true)
          echo "Distinct Swift compiler warnings: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$WARNINGS" | grep . | sed 's/%/%25/g; s/^/::warning::/' || true
      - name: Release manifest failure fixtures
        run: python3 -m unittest discover -s Tests/Tooling -p 'test_*.py'
      - name: Universal release build
        run: ./BuildMyDock.sh
      - name: Verify architecture and bundle
        run: |
          lipo build/MyDock.app/Contents/MacOS/MyDock -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/MyDock.app
          plutil -lint build/MyDock.app/Contents/Info.plist
      - name: Xcode qualification artifact and Focus metadata
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          ./GenerateXcodeProject.sh
          xcodebuild -project MyDock.xcodeproj -scheme MyDock -configuration Release -derivedDataPath .build/ci-xcode ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          test -d .build/ci-xcode/Build/Products/Release/MyDock.app/Contents/Resources/Metadata.appintents
      - name: Record and archive the exact Xcode artifact
        run: |
          APP_PATH=.build/ci-xcode/Build/Products/Release/MyDock.app
          lipo "$APP_PATH/Contents/MacOS/MyDock" -verify_arch arm64 x86_64
          plutil -lint "$APP_PATH/Contents/Info.plist"
          mkdir -p .build/ci-artifact
          ditto -c -k --keepParent "$APP_PATH" .build/ci-artifact/MyDock-Xcode.zip
          python3 Scripts/WriteReleaseManifest.py --app "$APP_PATH" --output .build/ci-artifact/release-manifest.json --qualification ci --archive .build/ci-artifact/MyDock-Xcode.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MyDock-Xcode-qualification-${{ matrix.os }}
          path: .build/ci-artifact/
          retention-days: 7
